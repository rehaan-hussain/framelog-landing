[build]
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' cdn.jsdelivr.net cdn.tailwindcss.com www.googletagmanager.com www.clarity.ms 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self' www.google-analytics.com region1.google-analytics.com *.clarity.ms; img-src 'self' data: www.googletagmanager.com; frame-ancestors 'none'"
